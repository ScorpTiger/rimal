name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build web app
        env:
          # The app checks this repository's releases for monthly map updates.
          VITE_UPDATE_REPO: ${{ github.repository }}
        run: |
          npm ci
          npm run build

      - name: Sync into Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Rimal-OffRoad.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Rimal-OffRoad-APK
          path: Rimal-OffRoad.apk
