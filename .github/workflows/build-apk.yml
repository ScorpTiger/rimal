name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build web app
        env:
          # The app checks this repository's releases for monthly map updates.
          VITE_UPDATE_REPO: ${{ github.repository }}
        run: |
          npm ci
          npm run build

      - name: Sync into Android project
        run: npx cap sync android

      - name: Fixed signing key (keeps data when updating)
        env:
          KEY: ${{ secrets.RIMAL_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEY" ]; then echo "$KEY" | base64 -d > android/app/rimal.keystore; echo "Signing with the Rimal key"; else echo "::warning::RIMAL_KEYSTORE_B64 secret not set — APK signed with a temporary key, so updating needs an uninstall"; fi

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Rimal-OffRoad.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Rimal-OffRoad-APK
          path: Rimal-OffRoad.apk

      - name: Build the user manual (PDF)
        run: |
          pip install --quiet reportlab pillow
          ls /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf || (sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core)
          python3 docs/manual/build_manual.py "4.0.${{ github.run_number }}" Rimal-User-Manual.pdf

      - name: Publish APK + manual (Releases → "Rimal app"; the app updates itself from here)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="4.0.${{ github.run_number }}"
          code=$((100 + ${{ github.run_number }}))
          signer=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)apksigner
          cert=$($signer verify --print-certs Rimal-OffRoad.apk | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          echo "version $ver code $code cert $cert"
          gh release delete app-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create app-latest Rimal-OffRoad.apk Rimal-User-Manual.pdf --title "Rimal app $ver" --latest \
            --notes "Install: download Rimal-OffRoad.apk and open it (allow 'Install unknown apps'), or in the app: Settings & tools → App update. The user manual is Rimal-User-Manual.pdf.

          versionCode: $code
          cert: $cert
          commit: ${{ github.sha }}"
