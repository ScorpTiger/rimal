name: Device test (Android emulator)

# Installs the real APK in an Android emulator and runs scripts/device_test.py against it,
# using real map packs, imagery, terrain and weather services. Results (pass/fail, screenshots,
# logs) are pushed to the "test-results" branch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      - name: Build APK
        env:
          VITE_UPDATE_REPO: ${{ github.repository }}
        run: |
          npm ci && npm run build && npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Rimal-OffRoad.apk

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Test tools
        run: pip install websocket-client

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Free disk space for the emulator
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/share/swift || true; df -h /; free -m

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disk-size: 12G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: python3 scripts/device_test.py

      - name: Publish results to the test-results branch
        if: always()
        run: |
          mkdir -p results && cd results
          git init -q -b test-results
          git config user.name "rimal-ci"; git config user.email "rimal-ci@users.noreply.github.com"
          echo "Run ${{ github.run_id }} on ${{ github.sha }}" > RUN.txt
          git add -A && git commit -q -m "Device test run ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" test-results
