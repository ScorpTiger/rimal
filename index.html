<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#14110d" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>Rimal — Off-Road Navigator</title>
</head>
<body>
  <div id="app">
    <div id="map"></div>

    <!-- Dashboard -->
    <aside id="dash">
      <div class="brand">RIMAL <span id="gpsState" class="pill">STARTING</span></div>
      <div class="big"><span id="dSpeed">—</span><small id="dSpeedUnit">km/h</small></div>
      <div class="grid" id="fields"></div>
      <div class="coord" id="dCoord">—</div>
      <div id="updState" class="upd" hidden></div>
      <div id="recState" class="rec idle">Not recording</div>
    </aside>

    <!-- Navigation banner -->
    <div id="navBar" hidden>
      <div class="navArrow"><svg viewBox="0 0 100 100" id="navArrowSvg"><path d="M50 6 L84 86 L50 68 L16 86 Z"/></svg></div>
      <div class="navInfo">
        <div class="navName" id="navName">—</div>
        <div class="navNums">
          <span><label>Distance</label><b id="navDist">—</b></span>
          <span><label>Bearing</label><b id="navBrg">—</b></span>
          <span><label>ETA</label><b id="navEta">—</b></span>
          <span id="navOffWrap"><label>Off track</label><b id="navOff">—</b></span>
        </div>
      </div>
      <button class="navStop" id="navStop" title="Stop navigation">✕</button>
    </div>
    <div id="alertBar" hidden></div>

    <div id="planBar" hidden>
      <div id="planInfo"></div>
      <div class="btns"><button id="planUndo" class="btn sm">↶ Undo</button><button id="planSave" class="btn sm">Save route</button><button id="planGo" class="primary sm">➤ Navigate</button><button id="planClose" class="btn sm">✕</button></div>
    </div>

    <button id="tilt" hidden title="Pitch &amp; roll"><div id="tiltPitch"></div><div id="tiltRoll"></div></button>

    <!-- Toolbar -->
    <nav id="tools">
      <button id="bRec" class="tool rec-btn" title="Record track"><i>●</i><span>Record</span></button>
      <button id="bMark" class="tool" title="Mark waypoint"><i>⚑</i><span>Mark</span></button>
      <button id="bGoto" class="tool" title="Go to"><i>➤</i><span>Go To</span></button>
      <button id="bBack" class="tool" title="TrackBack"><i>↶</i><span>TrackBack</span></button>
      <button id="bSearch" class="tool" title="Search &amp; POIs"><i>⌕</i><span>Search</span></button>
      <button id="bLib" class="tool" title="Trips, routes &amp; waypoints"><i>▤</i><span>Trips</span></button>
      <button id="bMaps" class="tool" title="Maps &amp; layers"><i>🛰</i><span>Maps</span></button>
      <button id="bTools" class="tool" title="Settings &amp; tools"><i>⚙</i><span>Settings</span></button>
      <button id="bMore" class="tool" title="More"><i>☰</i><span>More</span></button>
    </nav>

    <div id="mapBtns">
      <button id="bCompass" class="round" title="North-up / heading-up"><svg viewBox="0 0 40 40"><path d="M20 3 L27 20 L20 17 L13 20Z" fill="#e5484d"/><path d="M20 37 L27 20 L20 23 L13 20Z" fill="currentColor"/></svg></button>
      <button id="b3d" class="round txt" title="3D terrain">3D</button>
      <button id="bLayer" class="round" title="Satellite / topo">◧</button>
      <button id="bZoomIn" class="round">+</button>
      <button id="bZoomOut" class="round">−</button>
      <button id="bTint" class="round" title="Night-vision screen (red)">☾</button>
      <button id="bFollow" class="round" title="Follow my position">◎</button>
    </div>

    <div id="noMap" hidden>
      <h2>Maps not downloaded yet</h2>
      <p id="noMapText"></p>
      <div class="btns"><button id="noMapDl" class="primary">⬇ Download maps now</button><button id="noMapBtn" class="btn">Import from USB / more</button><button id="noMapLater" class="btn">Later</button></div>
      <p id="noMapProg" class="note"></p>
    </div>

    <div id="sheet" hidden><div class="sheetBox"><header><h2 id="sheetTitle"></h2><button id="sheetClose">✕</button></header><div id="sheetBody"></div></div></div>
    <div id="toast" hidden></div>
    <div id="appUpd" hidden><span id="appUpdTxt"></span><button id="appUpdGo" class="primary sm">Update</button><button id="appUpdX" class="btn sm">✕</button></div>
    <input type="file" id="fileInput" hidden />
  </div>
  <!-- Startup check (plain ES5 so it runs on any web engine): if the app fails to start,
       show why on screen instead of a blank map. -->
  <script>
  (function () {
    var errs = [];
    function add(m) { errs.push(String(m).slice(0, 300)); var b = document.getElementById('bootErr'); if (b) b.textContent = errs.join('\n'); }
    window.onerror = function (msg, src, line, col) { add(msg + (src ? ' @' + String(src).split('/').pop() + ':' + line + ':' + col : '')); };
    window.addEventListener && window.addEventListener('unhandledrejection', function (e) { add('Promise: ' + (e.reason && (e.reason.message || e.reason))); });
    window.__rimalBootError = add;
    function info() {
      var ua = navigator.userAgent || '';
      var chrome = (ua.match(/Chrome\/([\d.]+)/) || [])[1];
      var android = (ua.match(/Android ([\d.]+)/) || [])[1];
      var gl2 = false; try { gl2 = !!document.createElement('canvas').getContext('webgl2'); } catch (e) {}
      return { chrome: chrome, android: android, gl2: gl2, ua: ua, size: window.innerWidth + 'x' + window.innerHeight + ' @' + (window.devicePixelRatio || 1) + 'x' };
    }
    function show(reason) {
      if (window.__rimalReady || document.getElementById('bootPanel')) return;
      var i = info();
      var major = i.chrome ? parseInt(i.chrome, 10) : null;
      var old = major !== null && major < 100;
      var d = document.createElement('div');
      d.id = 'bootPanel';
      d.setAttribute('style', 'position:fixed;inset:0;z-index:99999;background:#14110d;color:#f3ece2;font:16px/1.45 sans-serif;padding:18px 22px;overflow:auto');
      d.innerHTML =
        '<h2 style="color:#e8a33d;margin:0 0 8px">Rimal could not start on this screen</h2>' +
        '<p style="margin:0 0 10px">' + (old || !i.gl2
          ? 'This head unit\'s web engine is too old for the map. Update <b>Android System WebView</b> (or <b>Google Chrome</b>) to version 100 or newer, then open Rimal again.'
          : 'Please take a photo of this screen and send it — it shows exactly what went wrong.') + '</p>' +
        '<table style="border-collapse:collapse;margin-bottom:10px">' +
        '<tr><td style="color:#a99d8c;padding:2px 14px 2px 0">Android</td><td><b>' + (i.android || '?') + '</b></td></tr>' +
        '<tr><td style="color:#a99d8c;padding:2px 14px 2px 0">Web engine (Chrome/WebView)</td><td><b>' + (i.chrome || 'unknown') + '</b>' + (old ? ' &nbsp;<span style="color:#ff8b8e">needs 100+</span>' : '') + '</td></tr>' +
        '<tr><td style="color:#a99d8c;padding:2px 14px 2px 0">3D graphics (WebGL2)</td><td><b>' + (i.gl2 ? 'yes' : 'NO') + '</b></td></tr>' +
        '<tr><td style="color:#a99d8c;padding:2px 14px 2px 0">Screen</td><td><b>' + i.size + '</b></td></tr>' +
        '<tr><td style="color:#a99d8c;padding:2px 14px 2px 0">Reason</td><td><b>' + reason + '</b></td></tr></table>' +
        '<pre id="bootErr" style="white-space:pre-wrap;color:#ff8b8e;font-size:13px;margin:0 0 10px">' + errs.join('\n') + '</pre>' +
        '<div style="color:#a99d8c;font-size:12px;word-break:break-all;margin-bottom:12px">' + i.ua + '</div>' +
        '<button onclick="location.reload()" style="font-size:18px;padding:12px 22px;border-radius:12px;border:0;background:#e8a33d;color:#1b1208">Try again</button>';
      document.body.appendChild(d);
    }
    window.__rimalShowBootPanel = show;
    setTimeout(function () { show(errs.length ? 'error while starting' : 'app did not finish starting within 15 s'); }, 15000);
  })();
  </script>
  <script nomodule>window.__rimalShowBootPanel && window.addEventListener('load', function () { window.__rimalShowBootPanel('web engine does not support modern JavaScript'); });</script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
